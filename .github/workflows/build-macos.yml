name: Build ZGT Desktop macOS

on:
  push:
    branches: [ main, fix/macos-niimbot-print ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: zgt-desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Generate application icons
        run: npm run tauri -- icon src-tauri/app-icon.svg

      - name: Build universal DMG
        run: npm run tauri -- build --bundles dmg --target universal-apple-darwin

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ZGT-Desktop-macOS-v0.1.9
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
